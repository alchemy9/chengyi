<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>非遗 · 大模型讲解体验</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#263b35;font:16px/1.7 system-ui,-apple-system,sans-serif}header{border-bottom:1px solid #dfdfd4;padding:22px 5vw;display:flex;justify-content:space-between;align-items:center}a{color:#95633b}main{max-width:1100px;margin:30px auto;padding:0 20px}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}.card{background:#fffefb;border:1px solid #dfdfd4;border-radius:14px;padding:24px;margin-bottom:18px}h1{font-size:25px;margin:0 0 12px}h2{font-size:19px;margin:0 0 12px}p{margin:8px 0 16px}.muted{color:#68756e;font-size:14px}button,input,select{font:inherit;border:1px solid #dfdfd4;border-radius:8px;padding:9px 12px;background:white;color:#263b35}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#263b35;color:white}.item{display:block;width:100%;text-align:left;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}label{display:block;margin:12px 0}select{display:block;width:100%}.answer{white-space:pre-wrap;min-height:160px;padding:16px 0}.badge{display:inline-block;border-radius:20px;background:#ece6d8;padding:3px 12px;font-size:13px}.action{background:#e9efe8;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:14px}#notice{color:#95633b;min-height:30px}#question{flex:1;min-width:150px}.active{border-color:#95633b;background:#f5ede2}[hidden]{display:none!important}@media(max-width:740px){.layout{grid-template-columns:1fr}header{gap:18px}}
</style></head><body><header><strong>非遗 · 大模型讲解体验</strong><div class="row"><a href="/voice">声音体验与测速</a><a href="/admin">模型与资料设置</a></div></header><main><div id="notice" role="status" aria-live="polite"></div><div class="layout"><aside><section class="card"><h2>讲解对象</h2><label>选择讲解对象<select id="audience"><option value="general">普通参观者</option><option value="children">儿童</option><option value="expert">已有基础的参观者</option></select></label><button id="new">开始新对话</button><p id="serviceMode" class="muted"></p></section><section class="card"><h2>选择物品</h2><div id="items"></div></section></aside><section><div class="card"><h1 id="title">选择一件物品，开始了解它</h1><p id="summary" class="muted"></p><div id="hotspots" class="row"></div><p id="context" class="muted"></p></div><div class="card"><span id="mode" class="badge">等待讲解</span><div id="answer" class="answer" aria-live="polite"></div><div id="actions"></div><p id="sources" class="muted"></p><p id="warning" class="muted"></p><form id="ask" class="row"><input id="question" placeholder="接着问一问这件物品…" maxlength="2000" required aria-label="你的问题"><button class="primary">提问</button></form><p class="muted">未接模型时会展示资料；接入后会生成讲解和自由问答。正式前端负责执行动画。</p></div></section></div></main><script>
const $=id=>document.getElementById(id);let items=[],session=null,visitorToken='',busy=false;
function notice(text){$('notice').textContent=text}
async function api(path,method='GET',body){const response=await fetch('/api/v1'+path,{method,headers:{'Content-Type':'application/json',...(visitorToken?{'X-Session-Token':visitorToken}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error?.message||'请求失败');return data.data}
function safe(action){return async event=>{try{await action(event)}catch(error){notice(error.message)}}}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(b=>b.disabled=value);$('audience').disabled=value}
async function serviceMode(){const response=await fetch('/health');const value=await response.json();$('serviceMode').textContent=value.data.llm_mode==='live'?'已启用大模型接口，可以测试真实讲解。':'当前为演示模式，先到模型设置页接入大模型。'}
async function newSession(){const data=await api('/sessions','POST',{audience:$('audience').value});session=data.session;visitorToken=data.session_token;$('answer').textContent='';$('actions').replaceChildren();$('mode').textContent='等待讲解';$('warning').textContent='';$('sources').textContent='';update();await serviceMode();notice('新的对话已开始，请选择物品。')}
function update(){const item=items.find(i=>i.id===session?.current_item_id);$('title').textContent=item?.name||'选择一件物品，开始了解它';$('summary').textContent=item?.summary||'';$('hotspots').replaceChildren();for(const hotspot of item?.hotspots||[]){const button=document.createElement('button');button.textContent='观察：'+hotspot.name;button.disabled=busy;button.onclick=safe(()=>interact({event:'hotspot',hotspot_id:hotspot.key}));$('hotspots').append(button)}const selected=item?.hotspots.find(h=>h.key===session?.current_hotspot_id);$('context').textContent=selected?'正在观察：'+selected.name+'。可以直接追问这个部位。':'';document.querySelectorAll('[data-item]').forEach(b=>b.classList.toggle('active',b.dataset.item===item?.id))}
const modes={demo:'演示讲解',live:'大模型讲解',fallback:'资料讲解'};
function showResult(result){session=result.session;$('answer').textContent=result.text;$('mode').textContent=modes[result.mode]||result.mode;$('warning').textContent=result.warning||'';$('sources').textContent='参考资料：'+[...new Set(result.sources.map(source=>source.source_name+' · '+source.title))].join('；');$('actions').replaceChildren();for(const action of result.actions){const box=document.createElement('div');box.className='action';box.textContent=({highlight:'高亮所选部位',play_animation:'播放部位演示',show_steps:'展示制作步骤'}[action.type]||action.type)+'（等待正式前端执行）';$('actions').append(box)}update()}
async function interact(payload){if(busy)return;setBusy(true);notice('');let committed=false,reader;try{if(!session)await newSession();$('answer').textContent='';$('sources').textContent='';$('actions').replaceChildren();$('mode').textContent='正在讲解';const response=await fetch('/api/v1/sessions/'+session.id+'/interact/stream',{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':visitorToken},body:JSON.stringify(payload)});if(!response.ok){const value=await response.json();throw Error(value.error?.message||'讲解失败')}reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';function consume(block){let type='',data='';for(const line of block.split('\n')){if(line.startsWith('event:'))type=line.slice(6).trim();if(line.startsWith('data:'))data+=line.slice(5).trim()}if(!data)return;const value=JSON.parse(data);if(type==='delta')$('answer').textContent+=value.text;if(type==='reset')$('answer').textContent='';if(type==='result'){committed=true;showResult(value)}if(type==='error')throw Error(value.message)}while(true){const {done,value}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done}).replace(/\r\n/g,'\n');let split;while((split=buffer.indexOf('\n\n'))>=0){consume(buffer.slice(0,split));buffer=buffer.slice(split+2)}if(done)break}if(!committed)throw Error('讲解连接中断，请刷新会话状态后重试。')}catch(error){$('mode').textContent='未完成';notice(error.message);if(!committed)$('answer').textContent='这次讲解没有完成，请重试。';if(session){try{session=await api('/sessions/'+session.id);update()}catch{session=null;visitorToken=''}}}finally{if(reader)await reader.cancel().catch(()=>{});setBusy(false)}}
$('new').onclick=safe(async()=>{setBusy(true);try{await newSession()}finally{setBusy(false)}});
$('ask').onsubmit=safe(async event=>{event.preventDefault();const question=$('question').value.trim();if(!question)return;await interact({event:'ask',question});$('question').value=''});
safe(async()=>{const [listing]=await Promise.all([api('/items?page_size=100'),serviceMode()]);items=listing.items;for(const item of items){const button=document.createElement('button');button.className='item';button.dataset.item=item.id;button.textContent=item.name;button.onclick=safe(()=>interact({event:'explain',item_id:item.id}));$('items').append(button)}if(!items.length)notice('还没有已发布的物品，请先在非遗资料中添加。')})();
</script></body></html>
